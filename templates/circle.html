<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">

    <title>Convert to Uppercase</title>
</head>
<body>
    <nav>
        <div class="logo">
            <img src="{{url_for('static', filename='LinkElist logo.png')}}" alt="LinkElist Logo">
        </div>
        <div class="nav">
            <ul>
                <li><a href="{{url_for('index')}}">Home</a></li>
                <li><a href="{{url_for('profile')}}">Profile</a></li>
                <li><a href="{{url_for('works')}}">Works</a></li>
                <li><a href="{{url_for('contact')}}">Contact</a></li>
            </ul>
        </div>
    </nav>

    <main class="project-page">

        <div class="project-container">

            <div class="project-label">
                GEOMETRY CALCULATOR
            </div>
            <h1>Area of a Circle</h1>
            <p class="project-description">
                Calculate the area of a circle by entering its radius.
            </p>

            <div class="formula">
                A = πr²
            </div>


            <form method="POST" class="project-form">

                <label for="radius">
                    Radius
                </label>

                <input
                    type="number"
                    id="radius"
                    name="radius"
                    placeholder="Enter radius"
                    step="any"
                    required
                >

                <button type="submit">
                    Calculate Area
                </button>
            </form>

            {% if result is not none %}
            <div class="result-box">
                <span>AREA OF CIRCLE</span>
                <strong>{{ result }}</strong>
                <small>square units</small>
            </div>
            {% endif %}
        </div>
    </main>
</body>
</html>
